# go-virtio/validate CI.
#
# This repo is a real-hardware validation harness, not a plain library, so
# its CI has two distinct concerns:
#
#   * vtest       — the host-side `vtest/` module (Venus/virgl reference
#                   client, refrender, protocol codecs) is portable Go. We
#                   build + vet it on all six 64-bit Go targets and run its
#                   full unit-test suite on the two native runners (the
#                   fd-passing SCM_RIGHTS tests use real socketpairs, which
#                   are not reliable under qemu-user, so the emulated legs
#                   build-and-vet only).
#
#   * tamago-build — the guest harnesses under `cmd/*validate` are tamago
#                   (GOOS=tamago) bare-metal amd64 programs; the standard
#                   toolchain cannot build them. We install the pinned
#                   tamago-go release and cross-compile every guest ELF, plus
#                   the host-side `cmd/mkseed` tool, to prove the harness
#                   still builds. (Booting the ELFs under QEMU against real
#                   virtio-*-pci devices is the run-*.sh flow, run out of
#                   band — it needs KVM/TCG + per-device backends.)

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vtest:
    name: vtest (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            native: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            native: true
          - arch: riscv64
            runner: ubuntu-latest
          - arch: loong64
            runner: ubuntu-latest
          - arch: ppc64le
            runner: ubuntu-latest
          - arch: s390x
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go build
        working-directory: vtest
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go vet
        working-directory: vtest
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go test (native only)
        if: ${{ matrix.native }}
        working-directory: vtest
        # No -race here: venusring_linux.go models the Venus command ring as
        # device-shared mmap memory, and its unit tests drive the "device"
        # side from a second goroutine writing the shared control words. That
        # is a data race by Go's memory model (real hardware relies on the
        # kernel/device memory ordering, which the race detector cannot see) —
        # the same reason the sibling drivers exempt device memory from
        # race/checkptr instrumentation. Coverage is still collected + gated.
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

  tamago-build:
    name: tamago-build (guest ELFs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The toolchain version is READ FROM go.mod, not pinned in this file.
      # Pinned, the two drift the moment anything raises the module: a pull
      # request taking github.com/usbarmory/tamago to v1.27.1 was built against
      # a toolchain still fetched at tamago-go1.26.4 and failed with
      #
      #     go: GOOSPKG="github.com/usbarmory/tamago" not found in module list
      #
      # which names neither version and reads like a broken module path.
      #
      # `go mod edit -json` parses go.mod offline and exactly -- no module
      # download, and no regex over a file whose `require` block can be written
      # as one line or as a parenthesised block. The step name is static
      # because `env.` in a step name is evaluated when the job starts, before
      # anything can have resolved it.
      - name: install tamago-go (version from go.mod)
        run: |
          set -euxo pipefail
          TAMAGO_VERSION=$(go mod edit -json \
            | jq -r '.Require[] | select(.Path=="github.com/usbarmory/tamago") | .Version')
          if [ -z "$TAMAGO_VERSION" ] || [ "$TAMAGO_VERSION" = "null" ]; then
            echo "::error::github.com/usbarmory/tamago is not required in go.mod"
            exit 1
          fi
          TAMAGO_VERSION="${TAMAGO_VERSION#v}"
          echo "tamago toolchain: $TAMAGO_VERSION (from go.mod)"
          url="https://github.com/usbarmory/tamago-go/releases/download/tamago-go${TAMAGO_VERSION}/tamago-go${TAMAGO_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/tamago-go.tar.gz
          # The release tarball packs the toolchain under absolute paths
          # (/usr/local/tamago-go/...), so extract as-is and locate bin/go
          # rather than assuming a strip depth. GOROOT is found relative to
          # the binary, so the intact tree just works.
          mkdir -p "$HOME/tamago-extract"
          tar -C "$HOME/tamago-extract" -xzf /tmp/tamago-go.tar.gz
          gobin=$(find "$HOME/tamago-extract" -type f -path '*/bin/go' | head -1)
          test -x "$gobin"
          echo "TAMAGO=$gobin" >> "$GITHUB_ENV"
      - name: build guest validate ELFs (tamago/amd64)
        env:
          GOWORK: off
          GOOS: tamago
          GOARCH: amd64
          GOOSPKG: github.com/usbarmory/tamago
        run: |
          set -euxo pipefail
          mkdir -p /tmp/elf
          for d in cmd/*/; do
            n=$(basename "$d")
            # cmd/mkseed is a host-side (non-tamago) helper — skip here.
            if grep -rq "usbarmory/tamago" "$d"; then
              "$TAMAGO" build -ldflags "-T 0x10010000 -R 0x1000" \
                -o "/tmp/elf/${n}.elf" "./$d"
              echo "built ${n}.elf"
            fi
          done
          ls -l /tmp/elf
      - name: build host mkseed tool
        run: |
          set -euxo pipefail
          GOWORK=off go build -o /tmp/mkseed ./cmd/mkseed
          echo "built mkseed"
